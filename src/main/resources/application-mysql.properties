# MySQL is the default profile. DB_USERNAME and DB_PASSWORD can still override
# the local development credentials from the shell.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/web_sach_cu?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
