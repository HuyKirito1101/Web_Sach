# Integration tests run against a separate MySQL schema, never the development database.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/web_sach_cu_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.demo-data.enabled=true
app.demo-accounts.reset-passwords=true
jwt.secret=MySqlIntegrationTestJwtSecret-ChangeBeforeDeployment-2026

spring.mail.username=test@example.com
spring.mail.password=test-only
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
