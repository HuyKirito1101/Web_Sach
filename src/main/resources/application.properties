# Server Config
server.port=8080

# Use MySQL when no profile is supplied. Run with --spring.profiles.active=h2
# when an in-memory database is preferred.
spring.profiles.default=mysql,local

# Spring MVC JSP Config
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# H2 fallback configuration (overridden by application-mysql.properties).
spring.datasource.url=jdbc:h2:mem:websach;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# File Upload Config
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Config - không commit khóa thật vào Git. Mỗi môi trường phải cấp JWT_SECRET
# riêng (tối thiểu 32 ký tự ngẫu nhiên).
jwt.secret=${JWT_SECRET:}
jwt.expirationMs=86400000

# Không tự tạo/reset tài khoản mật khẩu 123456 trên database thật.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

# Không để Spring trả stack trace hoặc exception nội bộ ra trình duyệt.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.forward-headers-strategy=framework

# Mail Config (Placeholder)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8

# Cloudinary Config (Placeholder)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
