# Server Config
server.port=8080

# Spring MVC JSP Config
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Database Config (H2 In-Memory - Tự động chạy ngay không cần cài đặt / điền mật khẩu MySQL)
spring.datasource.url=jdbc:h2:mem:web_sach_cu;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- CẤU HÌNH MYSQL THỰC TẾ (Nếu dùng MySQL local, hãy bỏ comment 5 dòng dưới và điền mật khẩu MySQL của bạn) ---
